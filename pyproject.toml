[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torofit"
version = "0.1.0a0"
description = "Fit smooth Fourier series on toroidal manifolds T^d to point-cloud data via persistent-cohomology circular coordinates."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Tanishq Bhatia", email = "bhatia.ta@northeastern.edu" },
    { name = "Jose Perea", email = "j.pereabenitez@northeastern.edu" },
]
keywords = [
    "topology",
    "tda",
    "topological data analysis",
    "persistent homology",
    "persistent cohomology",
    "circular coordinates",
    "fourier series",
    "manifold learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "gudhi>=3.8",
    "ripser>=0.6",
    "persim>=0.3",
    "joblib>=1.3",
    "dreimac @ git+https://github.com/Tanishqbh/DREiMac@partition",
]

[project.optional-dependencies]
anndata = ["anndata>=0.10", "scanpy>=1.10"]
dev = [
    "pytest>=7",
    "sphinx>=7",
    "nbsphinx",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/Tanishqbh/ToroFit"
Repository = "https://github.com/Tanishqbh/ToroFit"
Documentation = "https://torofit.readthedocs.io"
Issues = "https://github.com/Tanishqbh/ToroFit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["torofit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
