[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torofit"
version = "0.1.0"
description = "A basic fitness tracking Python package."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ToroFit Contributors" }]
keywords = ["fitness", "health", "tracking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/Tanishqbh/ToroFit"
Repository = "https://github.com/Tanishqbh/ToroFit"
Documentation = "https://torofit.readthedocs.io"

[tool.setuptools.packages.find]
where = ["."]
include = ["torofit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
